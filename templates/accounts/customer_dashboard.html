{% extends 'base.html' %}
{% block title %}My Dashboard - LabaHub{% endblock %}
{% block content %}
<h3 class="mb-4">Welcome, {{ user.first_name|default:user.username }}!</h3>
<div class="row g-3">
  <div class="col-md-6"><div class="card shadow-sm h-100"><div class="card-body">
    <h5>My Laundry Orders</h5>
    <p class="text-muted mb-0">Your orders will appear here in the next phase.</p>
  </div></div></div>
  <div class="col-md-6"><div class="card shadow-sm h-100"><div class="card-body">
    <h5>My Profile</h5>
    <p class="text-muted">View or update your details.</p>
    <a href="{% url 'profile' %}" class="btn btn-primary btn-sm">Open profile</a>
  </div></div></div>
</div>
{% endblock %}
